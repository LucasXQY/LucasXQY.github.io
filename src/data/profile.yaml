name: 'Qiyi (Lucas) Xie'
tagline: 'Reliable visual/signal restoration and detection under low-quality or low-SNR conditions'
bio:
  - "I'm an M.S.E. student (Fall 2025 – now) in Electrical Engineering at the University of Pennsylvania, concentrating in artificial intelligence. Before Penn, I received my bachelor's degree in Electrical and Electronic Engineering from Xiamen University Malaysia. I am applying to PhD programs for Fall 2027."
  - 'My interests revolve around reliable restoration and detection under low-quality or low-SNR conditions: low-light image enhancement with physics-inspired and selective generative methods, and gravitational-wave signal detection on time–frequency maps.'
  - "On low-light image enhancement, I have been a research assistant since 2024 in Dr. Jian Ding Tan's group at the S.M.A.R.T. Nexus Centre of Excellence, Xiamen University Malaysia, and I am grateful to be advised by him. On gravitational-wave transient detection, I work with Dr. Fan Zhang."
