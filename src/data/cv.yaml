research:
  - title: 'Low-Light Image Enhancement Research'
    org: 'XMUM Robotics Lab'
    role: 'Research Assistant'
    location: 'Selangor, MYS & Remote'
    dates: 'Sept 2024 – Present'
    bullets:
      - 'Perceptual-Structural Retinex-Inspired Network for Low-Light Image Enhancement (PRIN): Proposed, as first author, a Retinex-inspired network that splits a low-light image into reflectance and illumination and refines each in the wavelet domain, recovering texture and boundaries in the reflectance and adjusting brightness smoothly and coherently in the illumination, to balance exposure correction, structural preservation and a natural look.'
      - 'SSM-Based Low-Light Image Enhancement: Contributed to a second low-light enhancement study on stabilizing illumination conditioning in state-space (Mamba-based) restoration models, developing the illumination-aware conditioning strategy and evaluating it on benchmark datasets.'
      - 'Auditable Selective Generative Enhancement (VetoNet): Developed, as first author, a framework that decides region by region whether a low-light pipeline should keep its deterministic result or use a diffusion-based generative one, calibrated with conformal risk control so that the risk of harm from generation stays below a chosen level and generation is used only where it helps.'
  - title: 'Coherent GW-YOLO: Cross-Detector Coincidence for Time–Frequency Object Detection of Gravitational Waves'
    org: 'MIT LIGO'
    role: 'Research Assistant'
    location: 'Remote'
    dates: 'Jun 2026 – Present'
    bullets:
      - 'Extended YOLO-based time–frequency object detection into a coherent gravitational-wave framework by integrating cross-detector coincidence across dual (H1/L1) interferometers.'
      - 'Generated and processed Q-transform time–frequency representations of gravitational-wave strain data, including simulated BBH/BNS chirp signals, background noise, and negative samples for object detection and coincidence analysis.'
      - 'Designed a cross-detector matching strategy to distinguish astrophysical chirp-like signals from detector-specific glitches by comparing temporal alignment, frequency evolution, and candidate consistency across H1/L1 observations.'
      - 'Built structured labels and training protocols for gravitational-wave detection tasks, including event classification, bounding-box localization, and detector-pair association for coherent signal validation.'
      - 'Evaluated coherent object detection pipelines to suppress false positives in low-SNR searches, optimizing early-warning detection reliability.'
  - title: 'Integrated Digital Twin Microgrid for Renewable-Powered Charging Unit'
    org: 'XMUM SAIR'
    role: 'Research Project Leader'
    location: 'Selangor, MYS'
    dates: 'Apr 2024 – Jan 2025'
    bullets:
      - 'Designed and led a renewable-energy-powered microgrid system using wind turbines and photovoltaic panels, adopting digital twin technology for remote monitoring and cost-efficient solutions.'
      - 'Developed solar tracking code in C language for the ESP32 microcontroller and integrated photoelectric sensors to optimize panel tracking angles, improving operational efficiency.'
      - 'Built 3D models of photovoltaic components in SolidWorks and simulated operations within a Unity-based digital twin system for real-time microgrid monitoring and performance analysis of hybrid energy sources (solar and wind).'
  - title: 'Foundations of Robot Autonomy — Online Research Seminar'
    org: 'Georgia Institute of Technology'
    role: 'Member'
    location: 'Remote'
    dates: 'Nov 2023 – Jan 2024'
    bullets:
      - 'Participated in the Foundations of Robot Autonomy Online Research Seminar, learning key building blocks of autonomy such as perception, planning and control.'
      - 'Designed and implemented a path-finding robot simulation that navigates a multipath environment using computer vision for obstacle detection and avoidance.'
  - title: 'Performance Analysis of Machine Learning Algorithms for Identification of Type 1 Diabetes Mellitus'
    org: 'XMUM SAIR'
    role: 'Research Assistant'
    location: 'Selangor, MYS'
    dates: 'Apr 2023 – Aug 2023'
    bullets:
      - 'Implemented machine learning algorithms (such as KNN, Random Forest, etc.) to analyze and model the physical examination report data of a certain common disease to predict the risk of developing type 1 diabetes for a patient.'
      - 'Optimized Python-based machine learning codebases to improve performance and maintainability.'
      - 'Conducted patient data model construction and algorithms implementation to achieve robust comparisons of multiple machine learning models for final risk prediction.'
      - 'Standardized data pre-processing, training, and validation workflows for non-parametric and ensemble ML architectures (KNN and Random Forests).'

